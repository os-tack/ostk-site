<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">ostk route-aware output shaping</title>
  <desc id="desc">A raw request bypasses reduction. Otherwise a category router sends Narrate, Structured, Passthrough, and Dangerous output to dedicated handlers, while only Condense uses grammar and output-shape detection before conservative classification, visible reduction, and measured telemetry.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#9e8e7d"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#7fb88a"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#ffc169"/>
    </marker>
  </defs>
  <style>
    text{font-family:"Space Grotesk",ui-sans-serif,system-ui,sans-serif}
    .label{font-size:11px;font-weight:700;letter-spacing:1.5px;fill:#ffc169}
    .title{font-size:24px;font-weight:650;fill:#e7e1de}
    .step{font-size:15px;font-weight:750;fill:#e7e1de}
    .body{font-size:12px;fill:#c2c9b4}
    .minor{font-size:11px;fill:#9e8e7d}
    .number{font-size:10px;font-weight:750;letter-spacing:1px;fill:#ffc169}
    .yes{font-size:10px;font-weight:750;letter-spacing:1px;fill:#9bd3a4}
  </style>
  <rect width="900" height="520" fill="#100e0c"/>
  <path d="M0 0H900V78H0Z" fill="#151311"/>
  <text x="28" y="27" class="label">KERNEL-MEDIATED OUTPUT / ROUTE-AWARE</text>
  <text x="28" y="58" class="title">Keep tool output useful</text>

  <g>
    <rect x="28" y="134" width="164" height="88" fill="#1d1b19" stroke="#514536"/>
    <text x="44" y="158" class="number">01 / REQUEST</text>
    <text x="44" y="184" class="step">Tool result</text>
    <text x="44" y="207" class="body">body + route metadata</text>
  </g>
  <path d="M192 178H236" stroke="#9e8e7d" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="237" y="134" width="148" height="88" fill="#211f1d" stroke="#d4a457"/>
    <text x="253" y="158" class="number">02 / BYPASS</text>
    <text x="253" y="184" class="step">raw:true?</text>
    <text x="253" y="207" class="minor">decide before shaping</text>
  </g>

  <path d="M311 134V105H440" fill="none" stroke="#7fb88a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="326" y="99" class="yes">YES</text>
  <g>
    <rect x="441" y="88" width="431" height="66" fill="#122318" stroke="#7fb88a"/>
    <text x="459" y="113" class="number" fill="#9bd3a4">EXACT OUTPUT PATH</text>
    <text x="459" y="137" class="body">Return the unshaped body; reduction is bypassed.</text>
  </g>

  <path d="M311 222V257H441" fill="none" stroke="#ffc169" stroke-width="1.5" marker-end="url(#arrow-gold)"/>
  <text x="326" y="248" class="label">NO</text>
  <g>
    <rect x="441" y="226" width="431" height="74" fill="#211f1d" stroke="#ffc169"/>
    <text x="459" y="251" class="number">03 / CATEGORY ROUTER</text>
    <text x="459" y="276" class="step">Choose the route-specific handler</text>
  </g>

  <path d="M554 300V330H210V350" fill="none" stroke="#9e8e7d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M758 300V350" stroke="#ffc169" stroke-width="1.5" marker-end="url(#arrow-gold)"/>

  <g>
    <rect x="28" y="351" width="364" height="112" fill="#1d1b19" stroke="#514536"/>
    <text x="46" y="376" class="number">DEDICATED HANDLERS</text>
    <text x="46" y="404" class="step">Narrate · Structured</text>
    <text x="46" y="427" class="step">Passthrough · Dangerous</text>
    <text x="46" y="449" class="minor">Each handler preserves or shapes output by its own contract.</text>
  </g>

  <g>
    <rect x="421" y="331" width="451" height="150" fill="#211f1d" stroke="#ffc169" stroke-width="1.5"/>
    <text x="439" y="356" class="number">CONDENSE ONLY</text>
    <text x="439" y="383" class="step">Grammar → output shape → conservative fallback</text>
    <text x="439" y="409" class="body">Classify signal; preserve hazards and outcomes.</text>
    <text x="439" y="432" class="body">Digest blocks; apply visible structural, template,</text>
    <text x="439" y="451" class="body">and optional semantic deduplication.</text>
    <text x="439" y="470" class="minor">Return compact output with actual byte/token metrics.</text>
  </g>

  <text x="28" y="501" class="minor">Savings depend on the command and output. No route promises a fixed reduction ratio.</text>
</svg>