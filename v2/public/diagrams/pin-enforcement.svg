<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" role="img" aria-labelledby="title desc">
  <title id="title">ostk capability enforcement by execution surface</title>
  <desc id="desc">Identity evidence establishes a default posture and an optional pin profile composes effective capabilities. File edits, kernel verbs, and shell execution then enforce those capabilities through different surface-specific checks, each returning an explicit result.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#9e8e7d"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#ffc169"/>
    </marker>
  </defs>
  <style>
    text{font-family:"Space Grotesk",ui-sans-serif,system-ui,sans-serif}
    .label{font-size:11px;font-weight:700;letter-spacing:1.5px;fill:#ffc169}
    .title{font-size:24px;font-weight:650;fill:#e7e1de}
    .step{font-size:15px;font-weight:750;fill:#e7e1de}
    .body{font-size:12px;fill:#c2c9b4}
    .minor{font-size:11px;fill:#9e8e7d}
    .number{font-size:10px;font-weight:750;letter-spacing:1px;fill:#ffc169}
    .allow{font-size:11px;font-weight:700;fill:#9bd3a4}
    .deny{font-size:11px;font-weight:700;fill:#ffb4ab}
  </style>
  <rect width="900" height="590" fill="#100e0c"/>
  <path d="M0 0H900V78H0Z" fill="#151311"/>
  <text x="28" y="27" class="label">CAPABILITY POLICY / SURFACE-SPECIFIC ENFORCEMENT</text>
  <text x="28" y="58" class="title">One policy; explicit checks at each execution surface</text>

  <path d="M198 143H222" stroke="#9e8e7d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M412 143H436" stroke="#9e8e7d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M626 143H650" stroke="#ffc169" stroke-width="1.5" marker-end="url(#arrow-gold)"/>

  <g>
    <rect x="20" y="101" width="178" height="84" fill="#1d1b19" stroke="#514536"/>
    <text x="36" y="125" class="number">01 / IDENTITY</text>
    <text x="36" y="151" class="step">Verify evidence</text>
    <text x="36" y="171" class="minor">resolve T0–T3</text>
  </g>
  <g>
    <rect x="222" y="101" width="190" height="84" fill="#1d1b19" stroke="#514536"/>
    <text x="238" y="125" class="number">02 / TIER</text>
    <text x="238" y="151" class="step">Default posture</text>
    <text x="238" y="171" class="minor">baseline restrictions</text>
  </g>
  <g>
    <rect x="436" y="101" width="190" height="84" fill="#1d1b19" stroke="#514536"/>
    <text x="452" y="125" class="number">03 / OPTIONAL PIN</text>
    <text x="452" y="151" class="step">Compose caps</text>
    <text x="452" y="171" class="minor">denies + write: paths</text>
  </g>
  <g>
    <rect x="650" y="101" width="230" height="84" fill="#211f1d" stroke="#ffc169"/>
    <text x="666" y="125" class="number">04 / EFFECTIVE CAPS</text>
    <text x="666" y="151" class="step">Route by surface</text>
    <text x="666" y="171" class="minor">the executor owns enforcement</text>
  </g>

  <path d="M765 185V218H151V246" fill="none" stroke="#9e8e7d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M765 185V218H450V246" fill="none" stroke="#9e8e7d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M765 185V246" stroke="#9e8e7d" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="20" y="247" width="264" height="230" fill="#1d1b19" stroke="#d4a457"/>
    <text x="38" y="273" class="number">A / FS_OPS WRITE</text>
    <text x="38" y="301" class="step">Check the target path</text>
    <text x="38" y="328" class="body">1. configured write: prefix</text>
    <text x="38" y="350" class="body">2. global write denial</text>
    <text x="38" y="372" class="body">3. path deny tokens</text>
    <path d="M38 392H266" stroke="#373432"/>
    <text x="38" y="416" class="minor">An active pin that cannot load</text>
    <text x="38" y="435" class="minor">fails closed: deny all writes.</text>
    <text x="38" y="461" class="allow">ALLOW or matched DENY</text>
  </g>

  <g>
    <rect x="318" y="247" width="264" height="230" fill="#1d1b19" stroke="#d4a457"/>
    <text x="336" y="273" class="number">B / KERNEL VERB</text>
    <text x="336" y="301" class="step">Match the operation</text>
    <text x="336" y="328" class="body">deny-verb supports exact</text>
    <text x="336" y="350" class="body">and prefix matching.</text>
    <path d="M336 392H564" stroke="#373432"/>
    <text x="336" y="416" class="minor">This gate applies after caps</text>
    <text x="336" y="435" class="minor">have loaded successfully.</text>
    <text x="336" y="461" class="allow">ALLOW or named DENY</text>
  </g>

  <g>
    <rect x="616" y="247" width="264" height="230" fill="#1d1b19" stroke="#d4a457"/>
    <text x="634" y="273" class="number">C / BASH</text>
    <text x="634" y="301" class="step">Apply shell containment</text>
    <text x="634" y="328" class="body">Write-restricted caps request</text>
    <text x="634" y="350" class="body">the available shell membrane.</text>
    <path d="M634 392H862" stroke="#373432"/>
    <text x="634" y="416" class="minor">If containment is unavailable,</text>
    <text x="634" y="435" class="minor">the degraded path is explicit.</text>
    <text x="634" y="461" class="allow">CONTAIN or surface result</text>
  </g>

  <rect x="20" y="504" width="860" height="58" fill="#151311" stroke="#373432"/>
  <text x="38" y="529" class="label">BOUNDARY</text>
  <text x="124" y="529" class="body">These checks apply to kernel-mediated operations.</text>
  <text x="38" y="550" class="minor">Native client tools remain outside the kernel boundary and use their own permissions and coordination.</text>
</svg>