<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">ostk identity-derived default postures</title>
  <desc id="desc">Verified identity evidence resolves to one of four T0 through T3 default postures for kernel-mediated operations. T0 has no tier-default write restriction; T1 permits source writes subject to governed paths; T2 is read-oriented and denies writes to the governed source root, kernel state, and governance by default; T3 denies kernel-mediated writes by default.</desc>
  <style>
    text{font-family:"Space Grotesk",ui-sans-serif,system-ui,sans-serif}
    .label{font-size:11px;font-weight:700;letter-spacing:1.5px;fill:#ffc169}
    .title{font-size:24px;font-weight:650;fill:#e7e1de}
    .head{font-size:10px;font-weight:750;letter-spacing:1.25px;fill:#9e8e7d}
    .tier{font-size:20px;font-weight:800}
    .name{font-size:14px;font-weight:700;fill:#e7e1de}
    .body{font-size:12px;fill:#c2c9b4}
    .note{font-size:11px;fill:#9e8e7d}
  </style>
  <rect width="900" height="520" fill="#100e0c"/>
  <path d="M0 0H900V78H0Z" fill="#151311"/>
  <text x="28" y="27" class="label">BOOT IDENTITY / DEFAULT POSTURE</text>
  <text x="28" y="58" class="title">Resolve identity; explain what is allowed</text>

  <text x="36" y="107" class="head">TIER</text>
  <text x="128" y="107" class="head">IDENTITY EVIDENCE</text>
  <text x="508" y="107" class="head">DEFAULT KERNEL-MEDIATED POSTURE</text>

  <g>
    <rect x="28" y="120" width="844" height="76" fill="#1d1b19" stroke="#373432"/>
    <rect x="28" y="120" width="6" height="76" fill="#7fb88a"/>
    <text x="52" y="158" class="tier" fill="#9bd3a4">T0</text>
    <text x="128" y="148" class="name">Verified project or operator root</text>
    <text x="128" y="171" class="body">trusted Ed25519 / DSSE evidence; legacy GPG anchor</text>
    <text x="508" y="148" class="name">Full governance</text>
    <text x="508" y="171" class="body">No tier-default write restriction</text>
  </g>
  <g>
    <rect x="28" y="204" width="844" height="76" fill="#1d1b19" stroke="#373432"/>
    <rect x="28" y="204" width="6" height="76" fill="#8db7ef"/>
    <text x="52" y="242" class="tier" fill="#a8cbff">T1</text>
    <text x="128" y="232" class="name">Identity endorsed by a T0 root</text>
    <text x="128" y="255" class="body">verified delegated evidence or legacy cross-signature</text>
    <text x="508" y="232" class="name">Source writes with guardrails</text>
    <text x="508" y="255" class="body">kernel state + governance denied by default</text>
  </g>
  <g>
    <rect x="28" y="288" width="844" height="76" fill="#211f1d" stroke="#514536"/>
    <rect x="28" y="288" width="6" height="76" fill="#ffc169"/>
    <text x="52" y="326" class="tier" fill="#ffc169">T2</text>
    <text x="128" y="316" class="name">Identity present, not T0-endorsed</text>
    <text x="128" y="339" class="body">evidence resolves without the trusted endorsement</text>
    <text x="508" y="316" class="name">Read-oriented default</text>
    <text x="508" y="339" class="body">src/, kernel state + governance writes denied</text>
  </g>
  <g>
    <rect x="28" y="372" width="844" height="76" fill="#211f1d" stroke="#514536"/>
    <rect x="28" y="372" width="6" height="76" fill="#ffb4ab"/>
    <text x="52" y="410" class="tier" fill="#ffb4ab">T3</text>
    <text x="128" y="400" class="name">No verified identity evidence</text>
    <text x="128" y="423" class="body">boot cannot establish a recognized identity</text>
    <text x="508" y="400" class="name">Anonymous default</text>
    <text x="508" y="423" class="body">kernel-mediated writes denied</text>
  </g>

  <rect x="28" y="470" width="844" height="30" fill="#151311" stroke="#373432"/>
  <text x="44" y="490" class="note">Optional pins can add denials; configured write: prefixes carve out explicit paths where that surface supports them.</text>
</svg>